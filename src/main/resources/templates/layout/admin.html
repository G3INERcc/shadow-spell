<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <title>Shadow Slave - Admin</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <!-- FontAwesome -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    </head>
    <body class="bg-dark text-white">

        <!-- Navbar top -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary"> 
            <div class="container-fluid">
                <a th:href="@{/memorys/index}" class="navbar-brand text-white fw-bold">Shadow Slave</a>
                <div class="ms-auto">
                    <span class="text-white fw-bold">[ G3 ]</span>
                </div>
            </div>
        </nav>

        <div class="container-fluid">
            <div class="row">
                <!-- Fragmento Sidebar -->
                <div class="col-md-2 bg-black min-vh-100 p-3 border-end border-secondary">
                    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
                </div>

                <!-- Contenido dinámico -->
                <main class="col-md-10 px-md-4 py-4">
                    <section layout:fragment="content">
                        <h4>Cargando...</h4>
                    </section>
                </main>
            </div>
        </div> 

        <footer class="text-center py-3 text-muted border-top border-secondary mt-auto">
            Salve Weaver <br>
            Demonio del Destino <br>
            Primogénito del Dios Olvidado
        </footer>

        <!-- JS Bundle & jQuery -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    </body>
</html>
