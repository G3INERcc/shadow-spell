<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <head> 
        <title>Soul core</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    </head>
    <body>

        <section>

            <!-- Modal -->
            <div class="modal fade" id="memoryDetailModal"  tabindex="-1"  aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="memoryTitle">Shadow spell</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body" id="memoryDetail">
                            
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                            <button type="button" class="btn btn-primary">Noshe</button>
                        </div>
                    </div>
                </div>
            </div>

            <a th:href="@{/memorys/create}">Agregar memoria</a>
            <table>
                <thead>
                    <tr>
                        <th>#</th> 
                        <th>Foto</th> 
                        <th>Nombre</th> 
                        <th>ID</th> 
                        <th>Rango</th> 
                        <th>Descripcion</th> 
                        <th>Acciones</th> 
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="mem, item: ${memorys}">
                        <td th:text="${item.count}"></td>
                        <td>
                            <img th:if="${mem.photo != null and !#strings.isEmpty(mem.photo)}" 
                                 th:src="@{'/' + ${mem.photo}}" 
                                 alt="Foto de la memoria" 
                                 style="width: 40px; height: 40px; object-fit: cover;" />
                        </td>
                        <td th:text="${mem.name}"></td>
                        <td th:text="${mem.id}"></td>
                        <td th:text="${mem.rank}"></td>
                        <td th:text="${mem.description}"></td>
                        <td>
                            <a th:href="@{/memorys/delete(memId=${mem.id})}" 
                               onclick="return confirm('Desea destruir esta memoria?')">Eliminar</a>

                            <a th:href="@{/memorys/edit(memoryId=${mem.id})}">Editar</a>

                            <button type="button" th:onclick="|getDetailById(${mem.id})|" >Ver detalles</button>
                        </td>
                    </tr>
                </tbody>
            </table>


            <script>

                function getDetailById(id) {
                    let url = "/memorys/findById?memId=" + id;

                    $.ajax({
                        url:url,
                        type: 'GET',
                        cache:false

                    }).done(function (response) {
                        $('#memoryTitle').text(response.name);

                        let memoryStats = `
                            <strong>Id:</strong>${response.id}<br>
                            <strong>Nombre:</strong>${response.name}<br>
                            <strong>Rango:</strong>${response.rank}<br>
                            <strong>Descripcion:</strong>${response.description}<br>
                        `;
                        
                        $('#memoryDetail').html(memoryStats);
                        
                        let modal = new bootstrap.Modal(document.getElementById('memoryDetailModal'));
                        modal.show();
                        
                    }).fail(function(error){
                        console.error("Error al obtener producto", error);
                    });
                }

            </script>

        </section>
    </body>
</html>
